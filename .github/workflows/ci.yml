name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore backend/OnibusExpress.slnx

      - name: Build
        run: dotnet build backend/OnibusExpress.slnx -c Release --no-restore

      - name: Test
        run: dotnet test backend/OnibusExpress.slnx -c Release --no-build --logger "trx"

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Só valida que a imagem compila; não publica em nenhum registry
      - name: Build da imagem
        run: docker build -f Dockerfile backend
